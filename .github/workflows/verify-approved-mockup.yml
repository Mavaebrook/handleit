name: Verify published HandleIT mockup
on:
  push:
    branches: ['release/approved-mockup-20261114']
    paths: ['.github/workflows/verify-approved-mockup.yml']
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 678b863cca23744656e0e12af3a6194561927b00
      - name: Verify actual public files match the deployed source
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request,hashlib,json,time
          root=pathlib.Path('site');base='https://handleit.online';results=[]
          paths=[pathlib.Path('index.html')]+[p.relative_to(root) for p in sorted((root/'assets/home-20261114').iterdir())]
          for p in paths:
              url=base+('/' if str(p)=='index.html' else '/'+str(p))+'?release=678b863cca237'
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'HandleIT-release-check/1.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  assert response.status==200
                  raw=response.read()
              actual=hashlib.sha256(raw).hexdigest();expected=hashlib.sha256((root/p).read_bytes()).hexdigest()
              assert actual==expected,'Public source differs: '+str(p)
              results.append({'path':str(p),'status':200,'sha256':actual,'source_match':True})
          for p in ['/duotext/','/lawn-care/','/command.html']:
              with urllib.request.urlopen(base+p,timeout=30) as r:assert r.status==200
              results.append({'path':p,'status':200,'preserved':True})
          pathlib.Path('verification').mkdir(exist_ok=True)
          pathlib.Path('verification/public-files.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Install lightweight browser test driver
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-check"
          "$RUNNER_TEMP/browser-check/bin/pip" -q install playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            "$RUNNER_TEMP/browser-check/bin/python" -m playwright install --with-deps chromium
          fi
      - name: Test live desktop and mobile page
        run: |
          "$RUNNER_TEMP/browser-check/bin/python" - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json,shutil
          results=[];errors=[]
          browser_path=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=browser_path,args=['--no-sandbox'])
              for w in [390,1280]:
                  page=browser.new_page(viewport={'width':w,'height':900},device_scale_factor=1)
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  response=page.goto('https://handleit.online/?release=678b863cca237',wait_until='networkidle')
                  assert response.status==200
                  assert page.title()=='HandleIT Business Essentials — Your Work, Handled.'
                  assert page.locator('link[rel="canonical"]').get_attribute('href')=='https://handleit.online/'
                  assert page.locator('meta[name="handleit-release"]').get_attribute('content')=='approved-mockup-20261114'
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                  assert page.locator('.site-header .nav-wordmark').inner_text().replace('\n',' ')=='HandleIT by Peasantware'
                  page.evaluate('document.documentElement.style.scrollBehavior="auto"')
                  for img in page.locator('img').all():
                      if img.is_visible():
                          img.scroll_into_view_if_needed()
                          img.evaluate('(el)=>el.complete ? Promise.resolve() : new Promise((resolve,reject)=>{el.onload=resolve;el.onerror=reject})')
                          assert img.evaluate('(el)=>el.naturalWidth>0')
                  page.evaluate('window.scrollTo(0,0)')
                  page.screenshot(path=f'verification/live-{w}.png',full_page=True)
                  if w==390:
                      page.locator('.menu-button').click()
                      assert page.locator('.menu-button').get_attribute('aria-expanded')=='true'
                      page.locator('#main-nav a[href="#questions"]').click()
                      assert page.locator('.menu-button').get_attribute('aria-expanded')=='false'
                  page.locator('.mobile-actions [data-overview]' if w==390 else '.hotspot-watch').click()
                  assert page.locator('#overview-dialog').is_visible()
                  for _ in range(4):page.locator('#story-next').click()
                  assert not page.locator('#overview-dialog').is_visible()
                  page.locator('[data-demo-tab="upcoming"]').click()
                  assert 'Appointment reminder' in page.locator('#demo-panel').inner_text()
                  page.locator('[data-demo-tab="attention"]').click()
                  page.locator('[data-review="review"]').click()
                  assert page.locator('#review-dialog').is_visible()
                  page.locator('#demo-approve').click()
                  assert 'nothing published' in page.locator('#demo-panel').inner_text().lower()
                  assert page.locator('.contact-email').get_attribute('href')=='mailto:info@handleit.online'
                  results.append({'width':w,'http':200,'release_marker':True,'assets':True,'no_overflow':True,'overview':True,'command_demo':True,'contact_link':True})
                  page.close()
              browser.close()
          assert not errors,errors
          receipt={'public_url':'https://handleit.online/','commit':'678b863cca23744656e0e12af3a6194561927b00','checks':results,'javascript_errors':errors}
          Path('verification/browser-results.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt,indent=2))
          PY
      - name: Save public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handleit-approved-mockup-live-verification
          path: verification/
          retention-days: 7
