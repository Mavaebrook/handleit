name: Prepare approved HandleIT mockup
on:
  push:
    branches: ['release/approved-mockup-20261114']
    paths: ['.github/workflows/import-approved-mockup.yml']
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare one-time encrypted artifact handoff
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          trap 'rm -f ~/.ssh/release_key' EXIT
          ssh-keyscan -H 50.21.187.249 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 teddy@50.21.187.249 python3 - <<'PY'
          import pathlib,os
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          root=pathlib.Path('/home/teddy/handleit-releases');root.mkdir(mode=0o700,exist_ok=True)
          path=root/'mockup-transfer-20261114.pem'
          if not path.exists():
              key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
              raw=key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption())
              fd=os.open(str(path),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'wb') as f:f.write(raw)
          else:key=serialization.load_pem_private_key(path.read_bytes(),password=None)
          print(key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo).decode())
          PY
